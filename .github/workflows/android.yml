name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests and signed APK
        run: |
          gradle --no-daemon -PappVersion=1.0.${{ github.run_number }} -PappCode=${{ github.run_number }} test assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/JARVIS-Companion-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Companion
          path: dist/*.apk

      - name: Publish a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JARVIS Companion 1.0.${{ github.run_number }}
          body: |
            Sideload this APK on your Android phone (allow "install unknown apps" for your browser or file manager). Updates install over the old version and keep your pairing.
            Needs the JARVIS for Windows 1.4.0+ on your PC, and Tailscale on both devices.
          files: dist/*.apk
